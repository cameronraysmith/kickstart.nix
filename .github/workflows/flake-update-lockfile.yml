name: flake-update-lockfile
# adapted from
# https://github.com/numtide/system-manager/blob/82d5a9ecd15ec48bcbfbacf5462066ee267d6aae/.github/workflows/update-flake-lock.yml
on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1" # runs weekly every Monday at 03:45 UTC
  push:
    branches:
      - ci-flake-update

jobs:
  lockfile:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repo"
        uses: "actions/checkout@v4"
      - name: "Install the Nix package manager"
        uses: "cachix/install-nix-action@master"
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Update the lockfile"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          nix flake update --commit-lock-file
      - name: "Create Pull Request"
        uses: "peter-evans/create-pull-request@v7"
        with:
          branch: "auto_update_deps"
          title: "chore: update flake.lock"
          body: |
            - [x] update the flake lock file
